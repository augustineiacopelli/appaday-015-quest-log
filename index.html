<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>015 · Quest Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #1a1a2e;
      --surface:   #16213e;
      --panel:     #0f3460;
      --border:    #533483;
      --accent:    #e94560;
      --gold:      #ffd700;
      --green:     #57cc99;
      --text:      #e0e0e0;
      --muted:     #8892a4;
      --pixel:     1px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'VT323', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 80px;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(83,52,131,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(233,69,96,0.1) 0%, transparent 60%);
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 3px solid var(--border);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-link {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .back-link:hover { color: var(--accent); }

    .header-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255,215,0,0.5);
      letter-spacing: 0.05em;
      text-align: center;
      flex: 1;
    }

    .app-number {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--muted);
    }

    /* ── XP BAR ── */
    .xp-section {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 20px 0;
    }

    .xp-label {
      font-size: 18px;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .xp-label span { color: var(--gold); }

    .xp-track {
      height: 14px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      image-rendering: pixelated;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), #80ffdb);
      transition: width 0.5s cubic-bezier(.34,1.56,.64,1);
      min-width: 0;
      box-shadow: 0 0 8px rgba(87,204,153,0.6);
    }

    /* ── STATS ROW ── */
    .stats-row {
      max-width: 640px;
      margin: 14px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 10px;
    }

    .stat-chip {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-val {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: var(--gold);
      display: block;
    }
    .stat-lbl { font-size: 15px; color: var(--muted); display: block; margin-top: 4px; }

    /* ── ADD FORM ── */
    .add-section {
      max-width: 640px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .add-form {
      display: flex;
      gap: 10px;
    }

    .quest-input {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'VT323', monospace;
      font-size: 22px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .quest-input::placeholder { color: var(--muted); }
    .quest-input:focus { border-color: var(--accent); }

    .add-btn {
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: white;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.4); }
    .add-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }

    /* ── CATEGORY TABS ── */
    .tabs {
      max-width: 640px;
      margin: 18px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 7px 12px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab.active, .tab:hover {
      background: var(--panel);
      color: var(--gold);
      border-color: var(--gold);
    }

    /* ── QUEST LIST ── */
    .quest-list {
      max-width: 640px;
      margin: 16px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quest-item {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .quest-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .quest-item:hover { border-color: var(--accent); transform: translateX(3px); }
    .quest-item:hover::before { opacity: 1; }

    .quest-item.done {
      opacity: 0.45;
      border-color: var(--green);
    }
    .quest-item.done::before { background: var(--green); opacity: 1; }

    .quest-checkbox {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-radius: 3px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      image-rendering: pixelated;
    }
    .quest-item.done .quest-checkbox {
      background: var(--green);
      border-color: var(--green);
    }
    .quest-checkbox svg { display: none; }
    .quest-item.done .quest-checkbox svg { display: block; }

    .quest-body { flex: 1; min-width: 0; }

    .quest-name {
      font-size: 22px;
      color: var(--text);
      line-height: 1.2;
      word-break: break-word;
    }
    .quest-item.done .quest-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .quest-meta {
      font-size: 15px;
      color: var(--muted);
      margin-top: 3px;
    }

    .quest-xp {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--gold);
      flex-shrink: 0;
    }

    .quest-delete {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 3px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .quest-delete:hover { color: var(--accent); background: rgba(233,69,96,0.1); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-text { font-size: 22px; }

    /* ── ACHIEVEMENT TOAST ── */
    #toast-container {
      position: fixed;
      top: 70px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .achievement-toast {
      background: #1a1a2e;
      border: 3px solid var(--gold);
      border-radius: 4px;
      padding: 0;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 20px rgba(255,215,0,0.2);
      transform: translateX(360px);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease;
      pointer-events: none;
      overflow: hidden;
    }
    .achievement-toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .achievement-toast.hide {
      transform: translateX(360px);
      opacity: 0;
    }

    .toast-header {
      background: var(--gold);
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast-header-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #1a1a2e;
      letter-spacing: 0.05em;
    }

    .toast-body {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toast-icon {
      font-size: 36px;
      flex-shrink: 0;
      animation: iconPop 0.4s ease 0.3s both;
    }
    @keyframes iconPop {
      0%   { transform: scale(0) rotate(-20deg); }
      60%  { transform: scale(1.3) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .toast-content {}
    .toast-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--gold);
      margin-bottom: 5px;
    }
    .toast-desc {
      font-size: 17px;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }

    .toast-xp {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--green);
      margin-top: 5px;
    }

    /* ── LEVEL UP OVERLAY ── */
    #levelup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #levelup-overlay.show { opacity: 1; pointer-events: all; }

    .levelup-box {
      background: var(--surface);
      border: 4px solid var(--gold);
      border-radius: 8px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 0 60px rgba(255,215,0,0.4);
      animation: levelupPop 0.5s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes levelupPop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .levelup-stars { font-size: 36px; margin-bottom: 12px; letter-spacing: 8px; }
    .levelup-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .levelup-number {
      font-family: 'Press Start 2P', monospace;
      font-size: 48px;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255,215,0,0.7);
    }
    .levelup-dismiss {
      margin-top: 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 10px 20px;
      color: var(--text);
    }
    .levelup-dismiss:hover { border-color: var(--gold); color: var(--gold); }

    /* ── PARTICLES ── */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 1px;
      pointer-events: none;
      z-index: 99998;
      animation: particleFly var(--dur) ease-out forwards;
    }
    @keyframes particleFly {
      0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
    }

    @media (max-width: 400px) {
      .achievement-toast { width: calc(100vw - 32px); }
      .header-title { font-size: 10px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a class="back-link" href="https://augustineiacopelli.github.io/appaday/">← PORTFOLIO</a>
    <div class="header-title">QUEST LOG</div>
    <div class="app-number">015</div>
  </div>
</header>

<!-- XP BAR -->
<div class="xp-section">
  <div class="xp-label">
    <span id="level-label">LEVEL 1</span>
    <span id="xp-label">0 / 5 XP</span>
  </div>
  <div class="xp-track">
    <div class="xp-fill" id="xp-fill" style="width:0%"></div>
  </div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-chip">
    <span class="stat-val" id="stat-total">0</span>
    <span class="stat-lbl">QUESTS</span>
  </div>
  <div class="stat-chip">
    <span class="stat-val" id="stat-done">0</span>
    <span class="stat-lbl">DONE</span>
  </div>
  <div class="stat-chip">
    <span class="stat-val" id="stat-xp">0</span>
    <span class="stat-lbl">TOTAL XP</span>
  </div>
</div>

<!-- ADD FORM -->
<div class="add-section">
  <div class="add-form">
    <input class="quest-input" id="quest-input" type="text"
           placeholder="Add a homework quest..." maxlength="80" />
    <button class="add-btn" id="add-btn">+ ADD</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" data-filter="active">ACTIVE</button>
  <button class="tab" data-filter="done">COMPLETED</button>
  <button class="tab" data-filter="all">ALL</button>
</div>

<!-- QUEST LIST -->
<div class="quest-list" id="quest-list"></div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- LEVEL UP OVERLAY -->
<div id="levelup-overlay">
  <div class="levelup-box">
    <div class="levelup-stars">⭐ ⭐ ⭐</div>
    <div class="levelup-label">LEVEL UP!</div>
    <div class="levelup-number" id="levelup-num">2</div>
    <div id="levelup-unlock" style="display:none;"></div>
    <br>
    <button class="levelup-dismiss" onclick="dismissLevelUp()">CONTINUE</button>
  </div>
</div>

<script>
// ── BADGE TIERS ────────────────────────────────────────
// Each tier is unlocked at the listed level. Once unlocked, its badges
// enter the pool for all future achievement toasts.
const BADGE_TIERS = [
  { unlocksAt: 1,  label: 'STARTER',      badges: [
    { icon: '📚', title: 'QUEST COMPLETE!',   xp: 10 },
    { icon: '✏️', title: 'PENCILS DOWN!',     xp: 10 },
    { icon: '📝', title: 'NOTES TAKEN!',      xp: 12 },
  ]},
  { unlocksAt: 2,  label: 'APPRENTICE',   badges: [
    { icon: '⚔️', title: 'HOMEWORK SLAIN!',   xp: 15 },
    { icon: '🎯', title: 'BULLSEYE!',         xp: 15 },
    { icon: '💡', title: 'BRAIN UNLOCKED!',   xp: 18 },
  ]},
  { unlocksAt: 3,  label: 'SCHOLAR',      badges: [
    { icon: '🔥', title: 'ON FIRE!',          xp: 20 },
    { icon: '🌟', title: 'STAR STUDENT!',     xp: 20 },
    { icon: '🏹', title: 'SHARP SHOOTER!',    xp: 22 },
  ]},
  { unlocksAt: 5,  label: 'VETERAN',      badges: [
    { icon: '🧠', title: 'GALAXY BRAIN!',     xp: 25 },
    { icon: '🏆', title: 'KNOWLEDGE GAINED!', xp: 25 },
    { icon: '⚡', title: 'LIGHTNING MIND!',   xp: 28 },
  ]},
  { unlocksAt: 8,  label: 'CHAMPION',     badges: [
    { icon: '🐉', title: 'DRAGON SLAYER!',    xp: 32 },
    { icon: '👑', title: 'HOMEWORK ROYALTY!', xp: 32 },
    { icon: '🌈', title: 'LEGEND STATUS!',    xp: 35 },
  ]},
  { unlocksAt: 12, label: 'GRANDMASTER',  badges: [
    { icon: '💎', title: 'DIAMOND MIND!',     xp: 38 },
    { icon: '🚀', title: 'TO THE MOON!',      xp: 38 },
    { icon: '🌌', title: 'COSMIC SCHOLAR!',   xp: 40 },
  ]},
];

// XP required to reach the NEXT level from the current one.
// Formula: base 50 + 25 per level, so level 1→2 = 75, 2→3 = 100, etc.
function xpForLevel(lvl) { return 60 + ((lvl - 1) * 20); }

// Returns the pool of available badges given the current level.
function availableBadges(lvl) {
  return BADGE_TIERS
    .filter(t => t.unlocksAt <= lvl)
    .flatMap(t => t.badges);
}

// Returns tier unlocked exactly AT this level (for level-up display), or null.
function tierUnlockedAt(lvl) {
  return BADGE_TIERS.find(t => t.unlocksAt === lvl) || null;
}

// ── STATE ──────────────────────────────────────────────
let state = {
  quests:  JSON.parse(localStorage.getItem('ql-quests') || '[]'),
  totalXP: parseInt(localStorage.getItem('ql-xp') || '0'),
  level:   parseInt(localStorage.getItem('ql-level') || '1'),
  filter:  'active',
};

function save() {
  localStorage.setItem('ql-quests', JSON.stringify(state.quests));
  localStorage.setItem('ql-xp', state.totalXP);
  localStorage.setItem('ql-level', state.level);
}

// ── XP / LEVEL ─────────────────────────────────────────
function addXP(amount) {
  state.totalXP += amount;
  let lvl = 1, spent = 0;
  while (spent + xpForLevel(lvl) <= state.totalXP) {
    spent += xpForLevel(lvl);
    lvl++;
  }
  const newLevel = lvl;
  if (newLevel > state.level) {
    state.level = newLevel;
    setTimeout(() => showLevelUp(newLevel), 800);
  }
  save();
  updateXPBar();
}

function updateXPBar() {
  let lvl = 1, spent = 0;
  while (spent + xpForLevel(lvl) <= state.totalXP) {
    spent += xpForLevel(lvl);
    lvl++;
  }
  const cur  = state.totalXP - spent;
  const need = xpForLevel(lvl);
  const pct  = Math.min((cur / need) * 100, 100);
  document.getElementById('xp-fill').style.width = pct + '%';
  document.getElementById('level-label').textContent = 'LEVEL ' + lvl;
  document.getElementById('xp-label').textContent = cur + ' / ' + need + ' XP';
  document.getElementById('stat-xp').textContent = state.totalXP;
}

// ── LEVEL UP ────────────────────────────────────────────
function showLevelUp(lvl) {
  document.getElementById('levelup-num').textContent = lvl;

  // Show unlocked tier if applicable
  const tier = tierUnlockedAt(lvl);
  const unlockEl = document.getElementById('levelup-unlock');
  if (tier) {
    unlockEl.innerHTML = `
      <div style="margin-top:18px; border-top: 2px solid var(--border); padding-top:16px;">
        <div style="font-family:'Press Start 2P',monospace; font-size:8px; color:var(--muted); margin-bottom:10px;">
          NEW BADGES UNLOCKED
        </div>
        <div style="font-size:11px; color:var(--gold); font-family:'Press Start 2P',monospace; margin-bottom:10px;">
          ${tier.label} TIER
        </div>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
          ${tier.badges.map(b => `
            <div style="background:var(--panel); border:2px solid var(--border); border-radius:6px;
                        padding:10px 14px; text-align:center; min-width:80px;">
              <div style="font-size:28px;">${b.icon}</div>
              <div style="font-size:13px; color:var(--text); margin-top:5px; line-height:1.2;">${b.title}</div>
              <div style="font-family:'Press Start 2P',monospace; font-size:7px; color:var(--green); margin-top:4px;">+${b.xp} XP</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    unlockEl.style.display = 'block';
  } else {
    unlockEl.style.display = 'none';
  }

  document.getElementById('levelup-overlay').classList.add('show');
  spawnParticles();
}

function dismissLevelUp() {
  document.getElementById('levelup-overlay').classList.remove('show');
}

// ── PARTICLES ───────────────────────────────────────────
const COLORS = ['#ffd700','#e94560','#57cc99','#80ffdb','#a855f7','#3b82f6'];
function spawnParticles() {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.random() * 360) * Math.PI / 180;
    const dist  = 80 + Math.random() * 200;
    p.style.setProperty('--dx',  Math.cos(angle)*dist + 'px');
    p.style.setProperty('--dy',  Math.sin(angle)*dist + 'px');
    p.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    p.style.setProperty('--dur', (0.6 + Math.random()*0.6) + 's');
    p.style.left = cx + 'px';
    p.style.top  = cy + 'px';
    p.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1400);
  }
}

// ── TOAST ───────────────────────────────────────────────
let toastQueue = [];
let toastActive = false;

function showToast(questName) {
  const pool = availableBadges(state.level);
  const ach  = pool[Math.floor(Math.random() * pool.length)];
  toastQueue.push({ ...ach, questName });
  if (!toastActive) drainToast();
}

function drainToast() {
  if (!toastQueue.length) { toastActive = false; return; }
  toastActive = true;
  const { icon, title, xp, questName } = toastQueue.shift();

  const toast = document.createElement('div');
  toast.className = 'achievement-toast';
  toast.innerHTML = `
    <div class="toast-header">
      <span class="toast-header-text">⚡ ACHIEVEMENT UNLOCKED</span>
    </div>
    <div class="toast-body">
      <div class="toast-icon">${icon}</div>
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-desc">${questName}</div>
        <div class="toast-xp">+${xp} XP</div>
      </div>
    </div>
  `;

  document.getElementById('toast-container').appendChild(toast);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => toast.classList.add('show'));
  });

  addXP(xp);

  setTimeout(() => {
    toast.classList.add('hide');
    setTimeout(() => { toast.remove(); drainToast(); }, 400);
  }, 3200);
}

// ── QUESTS ──────────────────────────────────────────────
function addQuest() {
  const input = document.getElementById('quest-input');
  const name = input.value.trim();
  if (!name) return;
  state.quests.unshift({
    id: Date.now(),
    name,
    done: false,
    createdAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
  });
  input.value = '';
  save();
  render();
}

function toggleQuest(id) {
  const q = state.quests.find(q => q.id === id);
  if (!q) return;
  if (!q.done) {
    q.done = true;
    q.completedAt = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    showToast(q.name);
  } else {
    q.done = false;
    delete q.completedAt;
  }
  save();
  render();
}

function deleteQuest(id) {
  state.quests = state.quests.filter(q => q.id !== id);
  save();
  render();
}

function render() {
  const list = document.getElementById('quest-list');
  let filtered = state.quests;
  if (state.filter === 'active') filtered = filtered.filter(q => !q.done);
  if (state.filter === 'done')   filtered = filtered.filter(q => q.done);

  const done   = state.quests.filter(q => q.done).length;
  const active = state.quests.length - done;
  document.getElementById('stat-total').textContent = active;
  document.getElementById('stat-done').textContent  = done;
  updateXPBar();

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${state.filter === 'done' ? '🏆' : '📋'}</div>
        <div class="empty-text">${
          state.filter === 'done'
            ? 'No quests completed yet!'
            : state.filter === 'active'
            ? 'No active quests. Add one above!'
            : 'No quests yet. Start your adventure!'
        }</div>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(q => `
    <div class="quest-item ${q.done ? 'done' : ''}" onclick="toggleQuest(${q.id})">
      <div class="quest-checkbox">
        <svg width="14" height="11" viewBox="0 0 14 11" fill="none">
          <polyline points="1,5 5,9 13,1" stroke="#1a1a2e" stroke-width="2.5"
            stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </div>
      <div class="quest-body">
        <div class="quest-name">${escHtml(q.name)}</div>
        <div class="quest-meta">${q.done ? '✓ Completed ' + (q.completedAt || '') : 'Added ' + q.createdAt}</div>
      </div>
      <div class="quest-xp">+XP</div>
      <button class="quest-delete" onclick="event.stopPropagation(); deleteQuest(${q.id})" title="Delete">×</button>
    </div>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── EVENTS ──────────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', addQuest);
document.getElementById('quest-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addQuest();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.filter = tab.dataset.filter;
    render();
  });
});

// ── INIT ────────────────────────────────────────────────
render();
</script>
</body>
</html>
